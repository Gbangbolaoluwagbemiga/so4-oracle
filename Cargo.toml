[workspace]
members = ["oracle", "shared/config"]
resolver = "2"

[workspace.package]
rust-version = "1.95"

[workspace.lints.rust]
# Allow during the Rust 2024 migration while dependencies and generated code settle on one lifetime spelling.
mismatched_lifetime_syntaxes = "allow"

# Aligned with railway.json healthcheck: setting healthcheckPath to /ready
# ensures the probe reflects real liveness (/ready inspects state.cycle_status).
# panic = "unwind" is required for CatchPanicLayer to function — with
# panic = "abort", a single panicking handler kills the entire process
# immediately (#1213). The process-level restart is still handled by the
# railway/fly ON_FAILURE policy if the whole binary exits.
[profile.release]
overflow-checks = true
panic = "unwind"

# Force all transitive stellar-strkey versions to converge on 0.0.18 (#1007).
# stellar-xdr v27 pins stellar-strkey 0.0.13 transitively; the direct
# dependency in oracle/Cargo.toml is 0.0.18. Pre-1.0 semver cannot unify
# these, so three copies were being compiled. This patch collapses them.
[patch.crates-io]
stellar-strkey = { version = "0.0.18" }

